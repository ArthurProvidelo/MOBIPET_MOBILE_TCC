name: mobipet_mobile
description: "MobiPet — acompanhamento de atendimentos pet em tempo real."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_nova_mobipet.png"
  adaptive_icon_background: "#2D5D96"
  adaptive_icon_foreground: "assets/images/logo_nova_mobipet.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
