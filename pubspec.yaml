name: mobipet_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # Iconly (por piqo) — ícones gratuitos. Fontes extraídas do pacote
    # flutter_iconly (MIT) e embutidas localmente porque o pacote ainda
    # declara SDK Dart 2.x. Ver lib/theme/iconly_icons.dart.
    - family: IconlyLight
      fonts:
        - asset: assets/fonts/IconlyLight.ttf
    - family: IconlyBold
      fonts:
        - asset: assets/fonts/IconlyBold.ttf
